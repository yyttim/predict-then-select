[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellselect"
version = "0.2.0"
description = "Predictive objectives for cell selection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Yuntian Yang"}, {name = "Yiyang Zhang"}]
dependencies = ["numpy>=1.26", "pandas>=2", "scipy>=1.11", "torch>=2.2", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/yyttim/predict-then-select"

[project.optional-dependencies]
data = ["zarr>=2.18,<3", "numcodecs<0.16"]
dev = ["pytest", "nbformat", "nbclient"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
